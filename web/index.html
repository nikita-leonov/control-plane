<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>control-plane</title>
<style>
:root{
  --ground:#EDF0F2; --surface:#fff; --recess:#E2E8EB; --ink:#131A1F; --ink2:#4B5A64;
  --ink3:#78868F; --rule:#CDD6DA; --ruleh:#A6B3BA; --accent:#0E6A75; --accentd:#D3E4E7;
  --ok:#2C7A4B; --warn:#96610F; --crit:#A5382F; --shadow:rgba(19,26,31,.07);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --ground:#10161A; --surface:#171F24; --recess:#1E282E; --ink:#E4EBEF; --ink2:#A2B0B9;
  --ink3:#75858E; --rule:#2A363D; --ruleh:#3D4C55; --accent:#46C6D2; --accentd:#15333A;
  --ok:#55BC7E; --warn:#D69B3E; --crit:#E27A70; --shadow:rgba(0,0,0,.45);
}}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);
     -webkit-font-smoothing:antialiased}
header{border-bottom:2px solid var(--ink);padding:14px 20px;display:flex;
       align-items:baseline;gap:20px;flex-wrap:wrap;background:var(--surface)}
h1{font-size:14px;margin:0;letter-spacing:-.01em;font-weight:700}
.stamp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
       color:var(--ink3)}
.tabs{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-left:auto}
.tab{background:var(--surface);border:0;padding:6px 12px;font:600 11px/1 var(--mono);
     color:var(--ink3);cursor:pointer;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--accent);color:var(--surface)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;
     vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.crit{background:var(--crit)}.dot.warn{background:var(--warn)}
main{display:grid;grid-template-columns:minmax(0,1fr) 22rem;gap:1px;background:var(--rule);
     min-height:calc(100vh - 52px)}
.pane{background:var(--ground);padding:16px 20px;overflow:auto;min-width:0}
.side{background:var(--ground);padding:16px;display:flex;flex-direction:column;
      gap:14px;min-width:0;overflow:auto}
h2{font:600 10px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);
   margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--rule);border-top:2px solid var(--ink);
      box-shadow:0 1px 2px var(--shadow);padding:10px 12px}
.empty{color:var(--ink3);font-size:12px;line-height:1.6}
svg{width:100%;height:auto;max-height:52vh;display:block;background:var(--surface);border:1px solid var(--rule);
    border-top:2px solid var(--ink)}
.vtx{cursor:pointer}
.vtx:focus{outline:none}
.vtx:focus-visible rect{stroke:var(--accent);stroke-width:3}
.tab:focus-visible,tr.click:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.vtx rect,.vtx polygon{fill:var(--surface);stroke:var(--ruleh);stroke-width:1.5;
                       transition:fill .12s,stroke .12s}
.vtx.agent rect{fill:var(--surface);stroke:var(--ink)}
.vtx.edge rect{fill:var(--recess);stroke:var(--ruleh);stroke-dasharray:none}
.vtx.human rect{fill:var(--accentd);stroke:var(--accent);stroke-width:2}
.vtx.term rect{fill:var(--recess);stroke:var(--ruleh)}
.vtx.occupied rect{fill:var(--accent);stroke:var(--accent)}
.vtx.occupied text.lbl{fill:var(--surface)}
.vtx.sel rect{stroke:var(--accent);stroke-width:3}
.vtx text.lbl{font:600 11px var(--mono);fill:var(--ink);pointer-events:none}
.vtx text.sub{font:9px var(--mono);fill:var(--ink3);pointer-events:none;letter-spacing:.08em}
.lnk{fill:none;stroke:var(--ruleh);stroke-width:1.5;marker-end:url(#a)}
.lnk.hot{stroke:var(--accent);stroke-width:2.5;marker-end:url(#ah)}
.lnk.dim{opacity:.28}
.elabel{font:9px var(--mono);fill:var(--ink3)}
.badge{display:inline-block;font:600 9px/1 var(--mono);letter-spacing:.08em;
       text-transform:uppercase;padding:3px 6px;border:1px solid var(--rule);color:var(--ink3)}
.badge.parked{border-color:var(--accent);color:var(--accent);background:var(--accentd)}
.badge.done{border-color:var(--ok);color:var(--ok)}
.badge.running{border-color:var(--warn);color:var(--warn)}
table{border-collapse:collapse;width:100%;font:11px var(--mono);font-variant-numeric:tabular-nums}
th{text-align:left;font:600 9px var(--mono);letter-spacing:.1em;text-transform:uppercase;
   color:var(--ink3);padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--rule);color:var(--ink2);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--recess)}
td.k{color:var(--ink);font-weight:500}
.q{border-left:3px solid var(--accent);background:var(--accentd);padding:10px 12px;
   font-size:13px;line-height:1.5}
.q .asks{color:var(--ink);font-weight:600;margin-bottom:8px}
.opt{font-family:var(--mono);font-size:11px;color:var(--ink2);padding:3px 0;
     display:flex;gap:8px;align-items:baseline}
.opt b{color:var(--accent);min-width:56px;font-weight:600}
.ctx{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:6px}
.alert{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  flex-wrap:wrap;background:var(--accent);color:#fff;padding:9px 20px;
  border-bottom:2px solid var(--ink)}
.alert b{font:700 12px/1 var(--sans);letter-spacing:.01em}
.alert .chip{font:600 11px/1 var(--mono);background:rgba(255,255,255,.16);color:#fff;
  border:1px solid rgba(255,255,255,.35);padding:5px 9px;cursor:pointer}
.alert .chip:hover{background:rgba(255,255,255,.3)}
.alert .chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.alert .age{opacity:.8;font-weight:400}
.answers{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.ans{font:600 11px/1 var(--mono);background:var(--accent);color:#fff;border:0;
  padding:7px 11px;cursor:pointer;letter-spacing:.02em}
.ans:hover{filter:brightness(1.12)}
.ans:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.ans[disabled]{opacity:.5;cursor:progress}
.ans.hold{background:transparent;color:var(--ink2);border:1px solid var(--rule)}
.err{color:var(--crit);font:11px var(--mono);margin-top:6px}
.tab .pk{display:inline-block;background:var(--accent);color:#fff;border-radius:8px;
  padding:1px 5px;margin-left:6px;font-size:9px}
.tab[aria-selected="true"] .pk{background:#fff;color:var(--accent)}
h2 .n{color:var(--accent)}
.foot{font-family:var(--mono);font-size:10px;color:var(--ink3);padding:8px 20px;
      border-top:1px solid var(--rule);display:flex;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font:9px var(--mono);color:var(--ink3);letter-spacing:.06em;
        text-transform:uppercase;padding:8px 2px 0;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px;
          border:1.5px solid var(--ruleh);background:var(--surface);font-style:normal}
.legend i.h{background:var(--accentd);border-color:var(--accent)}
.legend i.e{background:var(--recess)}
.legend i.o{background:var(--accent);border-color:var(--accent)}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>control-plane</h1>
  <span class="stamp" id="stamp">loading</span>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<div class="alert" id="alert" hidden></div>
<main>
  <div class="pane">
    <h2>Graph <span id="gname" style="color:var(--accent)"></span></h2>
    <div id="graph"></div>
    <div class="legend">
      <span><i></i>node — judgment</span>
      <span><i class="e"></i>edge — deterministic script</span>
      <span><i class="h"></i>human node</span>
      <span><i class="o"></i>token here now</span>
    </div>
    <div style="margin-top:16px">
      <h2 id="dtitle">Detail</h2>
      <div class="card" id="detail"></div>
    </div>
  </div>
  <div class="side">
    <div><h2>Waiting on you <span style="color:var(--ink3);text-transform:none;
      letter-spacing:0">— all factories</span></h2>
      <div class="card" id="decisions"></div></div>
    <div><h2>Tokens</h2><div class="card" id="tokens"></div></div>
    <div><h2>Backlog</h2><div class="card" id="backlog"></div></div>
  </div>
</main>
<div class="foot">
  <span id="gate"></span><span id="tree"></span><span id="poll"></span>
</div>

<script>
const $ = s => document.querySelector(s);
let S = null, FACTORY = null, SEL = null, SELTOK = null;

async function poll(){
  try{
    const r = await fetch('/api/state',{cache:'no-store'});
    S = await r.json();
    if(!FACTORY) FACTORY = S.factories[0]?.name;
    render();
    $('#poll').textContent = 'refreshed ' + S.generated;
  }catch(e){ $('#poll').textContent = 'server gone — cp serve stopped?'; }
}

/* Vertices are of three kinds and the picture has to keep them apart: a node is
   where judgment happens, an edge is a script, a terminal is where a token
   stops. Depth comes from a BFS over the combined graph, so the drawing follows
   the definition rather than a hand-placed layout that can drift from it. */
function buildGraph(){
  const g = S.graph, nt = S.node_types;
  if(!g.edges) return null;
  const V = new Map(), adj = [];
  const add = (id,kind) => { if(!V.has(id)) V.set(id,{id,kind,depth:0}); };
  Object.keys(nt.nodes||{}).forEach(n => { if(!nt.nodes[n].verdicts_from_question) add(n,'node'); });
  Object.keys(g.edges).forEach(e => add(e,'edge'));
  Object.keys(g.terminals||{}).forEach(t => add(t, g.terminals[t].kind==='human'?'human':'term'));

  const hb = new Set((g.factories?.[FACTORY]?.human_before)||[]);
  for(const [n,spec] of Object.entries(nt.nodes||{})){
    for(const [v,rule] of Object.entries(spec.verdicts||{})){
      const to = rule.parks ? '@park' : rule.edge;
      if(V.has(n) && V.has(to)) adj.push({from:n,to,label:v,kind:'verdict'});
    }
  }
  for(const [e,spec] of Object.entries(g.edges)){
    for(const [code,to] of Object.entries(spec.routes||{})){
      if(V.has(e) && V.has(to)) adj.push({from:e,to,label:'exit '+code,kind:'route'});
    }
    if(hb.has(e)) adj.push({from:'@park',to:e,label:'you say yes',kind:'human'});
  }

  const hasIncoming = new Set(adj.map(a=>a.to));
  const seeds = [...V.values()]
    .filter(v => v.kind === 'node' && !hasIncoming.has(v.id))
    .map(v => v.id);
  if(g.entry && V.has(g.entry) && !seeds.includes(g.entry)) seeds.unshift(g.entry);
  const seen = new Set(seeds.length ? seeds : [V.keys().next().value]);
  let front = [...seen], d = 0;
  while(front.length && d < 24){
    const next = [];
    front.forEach(id => { V.get(id).depth = Math.max(V.get(id).depth, d); });
    front.forEach(id => adj.filter(a=>a.from===id).forEach(a=>{
      if(!seen.has(a.to)){ seen.add(a.to); next.push(a.to); }
    }));
    front = next; d++;
  }
  V.forEach(v => { if(!seen.has(v.id)) v.depth = d; });
  return {V,adj,hb};
}

function render(){
  const f = S.factories.find(x=>x.name===FACTORY) || S.factories[0];
  const parked = S.tokens.filter(t=>t.status==='parked' && t.question);
  const pkBy = {}; parked.forEach(t=>pkBy[t.factory]=(pkBy[t.factory]||0)+1);

  $('#tabs').innerHTML = S.factories.map(x=>{
    const ok = x.gate ? (x.gate.ok?'ok':'crit') : 'warn';
    const n = pkBy[x.name];
    return `<button class="tab" role="tab" aria-selected="${x.name===FACTORY}"
      data-f="${x.name}"><span class="dot ${ok}"></span>${x.name}${
      n?`<span class="pk">${n}</span>`:''}</button>`;
  }).join('');

  /* The bar exists so a blocked token cannot be something you find later. It is
     sticky, it is the only saturated thing on the page, and it disappears
     entirely when nothing is waiting — an always-present banner is one you stop
     seeing. */
  const bar = $('#alert');
  if(parked.length){
    bar.hidden = false;
    bar.innerHTML = `<b>${parked.length} waiting on you</b>` + parked.map(t=>
      `<button class="chip" data-jump="${t.token}" data-fac="${t.factory}">
        ${t.factory} · ${t.token}<span class="age"> — ${ago(t.waiting_since)}</span>
      </button>`).join('');
    bar.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
      FACTORY=b.dataset.fac; SELTOK=b.dataset.jump; SEL=null; render();
      document.querySelector('#decisions .q')?.scrollIntoView({block:'nearest'});
    });
    document.title = `(${parked.length}) control-plane`;
  } else {
    bar.hidden = true; bar.innerHTML=''; document.title = 'control-plane';
  }
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    FACTORY=b.dataset.f; SEL=null; SELTOK=null; render();
  });
  $('#stamp').textContent = (S.ran_at? 'gate '+S.ran_at : 'gate never run');
  $('#gname').textContent = FACTORY;

  const g = buildGraph();
  drawGraph(g, f);
  drawTokens();
  drawDecisions();
  drawBacklog(f);
  drawDetail(g);

  const ck = f.gate ? `${f.gate.checks.filter(c=>c.status==='pass').length}/${f.gate.checks.filter(c=>c.status!=='skipped').length}` : '—';
  $('#gate').innerHTML = `<span class="dot ${f.gate&&f.gate.ok?'ok':'crit'}"></span>${f.name} gate ${ck}`;
  $('#tree').textContent = f.tree;
}

function drawGraph(g, f){
  if(!g){ $('#graph').innerHTML='<div class="card empty">No graph definition.</div>'; return; }
  const toks = S.tokens.filter(t=>t.factory===FACTORY);
  const here = new Map();
  toks.forEach(t => here.set(t.node, (here.get(t.node)||[]).concat(t.token)));
  const path = SELTOK ? new Set(S.transitions.filter(x=>x.token===SELTOK)
                                 .flatMap(x=>[x.from,x.edge,x.to].filter(Boolean))) : null;

  const cols = {};
  [...g.V.values()].forEach(v => (cols[v.depth] = cols[v.depth]||[]).push(v));
  const CW=168, RH=60, PAD=22;
  const W = (Math.max(...Object.keys(cols).map(Number))+1)*CW + PAD*2;
  const H = Math.max(...Object.values(cols).map(c=>c.length))*RH + PAD*2 + 10;
  const pos = new Map();
  Object.entries(cols).forEach(([d,list])=>{
    const off = (H - list.length*RH)/2;
    list.sort((a,b)=>a.id.localeCompare(b.id)).forEach((v,i)=>
      pos.set(v.id,{x:PAD+ +d*CW, y:off+i*RH, w:126, h:34}));
  });

  const arc = a=>{
    const s=pos.get(a.from), t=pos.get(a.to); if(!s||!t) return '';
    const x1=s.x+s.w, y1=s.y+s.h/2, x2=t.x, y2=t.y+t.h/2;
    const hot = path && path.has(a.from) && path.has(a.to);
    const dim = path && !hot;
    if(x2<=x1){ // a loop back to an earlier column
      const my=Math.max(y1,y2)+30;
      return `<path class="lnk ${hot?'hot':''} ${dim?'dim':''}"
        d="M${x1},${y1} C${x1+30},${my} ${x2-30},${my} ${x2},${y2}"/>`;
    }
    const mx=(x1+x2)/2;
    return `<path class="lnk ${hot?'hot':''} ${dim?'dim':''}"
      d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
  };

  const box = v=>{
    const p=pos.get(v.id); if(!p) return '';
    const occ = here.has(v.id);
    const isHuman = v.kind==='human' || g.hb.has(v.id);
    const cls = [ 'vtx', v.kind==='node'?'agent':v.kind,
                  isHuman?'human':'', occ?'occupied':'', SEL===v.id?'sel':'' ].join(' ');
    const sub = v.kind==='node' ? 'NODE' : v.kind==='edge' ? (g.hb.has(v.id)?'EDGE · YOU GATE IT':'EDGE')
              : v.kind==='human' ? 'HUMAN' : 'TERMINAL';
    const n = occ ? ` (${here.get(v.id).length})` : '';
    return `<g class="${cls}" data-v="${v.id}" tabindex="0" role="button"
      aria-label="${v.id}, ${sub.toLowerCase()}${occ?', token here':''}">
      <rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="2"/>
      <text class="lbl" x="${p.x+9}" y="${p.y+15}">${v.id}${n}</text>
      <text class="sub" x="${p.x+9}" y="${p.y+27}">${sub}</text></g>`;
  };

  $('#graph').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet">
    <defs>
      <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
        orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--ruleh)"/></marker>
      <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7"
        orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--accent)"/></marker>
    </defs>
    ${g.adj.map(arc).join('')}
    ${[...g.V.values()].map(box).join('')}</svg>`;
  $('#graph').querySelectorAll('.vtx').forEach(el=>{
    const pick = () => { SEL = SEL===el.dataset.v ? null : el.dataset.v; render(); };
    el.onclick = pick;
    el.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
  });
}

function drawTokens(){
  const t = S.tokens.filter(x=>x.factory===FACTORY);
  if(!t.length){ $('#tokens').innerHTML =
    `<div class="empty">No token has entered this graph.<br><br>
     <code>bin/cp-run ${FACTORY} &lt;issue&gt; --dry-run</code></div>`; return; }
  $('#tokens').innerHTML = `<table><tbody>${t.map(x=>`
    <tr class="click" data-t="${x.token}" tabindex="0">
      <td class="k">${x.token}</td><td>${x.node}</td>
      <td style="text-align:right"><span class="badge ${x.status}">${x.status}</span></td>
    </tr>`).join('')}</tbody></table>`;
  $('#tokens').querySelectorAll('tr').forEach(r=>{
    const pick = () => { SELTOK = SELTOK===r.dataset.t ? null : r.dataset.t; SEL=null; render(); };
    r.onclick = pick;
    r.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
  });
}

function ago(iso){
  if(!iso) return 'just now';
  const s = Math.max(0, (Date.now() - Date.parse(iso))/1000);
  if(s < 90) return Math.round(s)+'s';
  if(s < 5400) return Math.round(s/60)+'m';
  if(s < 172800) return Math.round(s/3600)+'h';
  return Math.round(s/86400)+'d';
}

async function answer(token, value, btn){
  const card = btn.closest('.q');
  card.querySelectorAll('.ans').forEach(b=>b.disabled=true);
  btn.textContent = '…';
  try{
    const r = await fetch('/api/answer', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({token, value})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || ('HTTP '+r.status));
    await poll();
  }catch(e){
    const p = document.createElement('div');
    p.className = 'err'; p.textContent = e.message;
    card.appendChild(p);
    card.querySelectorAll('.ans').forEach(b=>{b.disabled=false;});
    btn.textContent = value;
  }
}

function drawDecisions(){
  const parked = S.tokens.filter(t=>t.status==='parked' && t.question);
  const label = S.decisions||[];
  if(!parked.length && !label.length){
    $('#decisions').innerHTML = '<div class="empty">Nothing is waiting on you.</div>'; return; }
  parked.sort((a,b)=>a.factory.localeCompare(b.factory));
  $('#decisions').innerHTML = parked.map(t=>`
    <div class="q" style="margin-bottom:10px" data-token="${t.token}">
      <div class="ctx" style="margin:0 0 4px">${t.factory} · ${t.token}
        · waiting ${ago(t.waiting_since)}</div>
      <div class="asks">${t.question.asks}</div>
      ${(t.question.options||[]).map(o=>
        `<div class="opt"><b>${o.value}</b><span>${o.means}</span></div>`).join('')}
      ${(t.question.context||[]).map(c=>
        `<div class="ctx">${c.ref} — ${c.why}</div>`).join('')}
      <div class="answers">${(t.question.options||[]).map(o=>
        `<button class="ans ${o.edge==='@park'?'hold':''}"
          data-t="${t.token}" data-v="${o.value}"
          title="${o.means} → ${o.edge}">${o.value}</button>`).join('')}</div>
    </div>`).join('') + (label.length ? `<div class="empty">
      ${label.map(d=>`${d.id} — ${d.title}`).join('<br>')}
      <br><br>from the <code>blocked-on-nikita</code> label, not a parked token.</div>`:'');
  $('#decisions').querySelectorAll('.ans').forEach(b=>
    b.onclick = () => answer(b.dataset.t, b.dataset.v, b));
}

function drawBacklog(f){
  if(!f.backlog){ $('#backlog').innerHTML =
    `<div class="empty">${f.name} has no beads backlog. Its work is not dispatchable yet.</div>`;
    return; }
  const w=f.work;
  const rows=[['ready',w.ready_known?w.ready:'?'],['in progress',w.wip],
              ['waiting',w.waiting],['closed',w.done]];
  $('#backlog').innerHTML = `<table><tbody>${rows.map(([k,v])=>
    `<tr><td class="k">${k}</td><td style="text-align:right">${v}</td></tr>`).join('')}
    </tbody></table>`;
}

function drawDetail(g){
  const T = S.transitions.filter(x => x.factory === FACTORY);
  if(SELTOK){
    const rows = T.filter(x=>x.token===SELTOK);
    $('#dtitle').innerHTML = `Path of <span style="color:var(--accent)">${SELTOK}</span>`;
    $('#detail').innerHTML = `<table><thead><tr><th>when</th><th>from</th><th>verdict</th>
      <th>edge</th><th>exit</th><th>to</th><th>ms</th><th>why</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.ts.slice(11,19)}</td><td class="k">${r.from}</td>
        <td>${r.verdict??'—'}</td><td>${r.edge??'—'}</td><td>${r.exit??'—'}</td>
        <td class="k">${r.to}</td><td style="text-align:right">${r.ms??''}</td>
        <td>${r.why??(r.actor==='human'?'you answered':'')}</td></tr>`).join('')}
      </tbody></table>
      <div class="ctx" style="margin-top:8px">This is the whole provenance record.
      Why it landed is a path, not a transcript.</div>`;
    return;
  }
  if(SEL){
    const rows = T.filter(x=>x.from===SEL || x.edge===SEL || x.to===SEL);
    $('#dtitle').innerHTML = `<span style="color:var(--accent)">${SEL}</span> — every crossing`;
    $('#detail').innerHTML = rows.length ? `<table><thead><tr><th>when</th><th>token</th>
      <th>from</th><th>verdict</th><th>edge</th><th>exit</th><th>to</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.ts.slice(11,19)}</td><td class="k">${r.token}</td>
        <td>${r.from}</td><td>${r.verdict??'—'}</td><td>${r.edge??'—'}</td>
        <td>${r.exit??'—'}</td><td>${r.to}</td></tr>`).join('')}</tbody></table>`
      : `<div class="empty"><b>${SEL}</b> has never been crossed.</div>`;
    return;
  }
  $('#dtitle').textContent = 'Recent crossings';
  const recent = T.slice(-14).reverse();
  $('#detail').innerHTML = recent.length ? `<table><thead><tr><th>when</th><th>token</th>
    <th>from</th><th>verdict</th><th>edge</th><th>exit</th><th>to</th></tr></thead><tbody>
    ${recent.map(r=>`<tr><td>${r.ts.slice(11,19)}</td><td class="k">${r.token}</td>
      <td>${r.from}</td><td>${r.verdict??'—'}</td><td>${r.edge??'—'}</td>
      <td>${r.exit??'—'}</td><td>${r.to}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">No edge has ever been crossed. Click a node or an edge to
       see its history once there is one.</div>`;
}

poll();
setInterval(() => { if(!document.hidden) poll(); }, 3000);
</script>
</body>
</html>
